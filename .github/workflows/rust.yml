name: Rust rewrite

on:
  push:
    branches: [rust-rewrite]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Rust · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel, windows-2025]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets --locked
      - name: Python/Rust differential fixture
        if: runner.os == 'Linux'
        env:
          CODEX_METER_RUST_BIN: ${{ github.workspace }}/target/debug/codex-meter
        run: python3 -m unittest -v tests.test_rust_python_parity
      - run: cargo build --release --locked
      - name: Smoke command surface
        shell: bash
        run: |
          set -eu
          binary=target/release/codex-meter
          if [ "${{ runner.os }}" = Windows ]; then binary="$binary.exe"; fi
          meter_home="$RUNNER_TEMP/codex-meter-rust-smoke"
          "$binary" --version
          "$binary" --no-color demo
          "$binary" --home "$meter_home" --no-color summary --period all
          "$binary" --home "$meter_home" --no-color history --group month
          "$binary" --home "$meter_home" otel config
          "$binary" --home "$meter_home" network show --limit 1
          "$binary" --home "$meter_home" remote list
          printf '' | "$binary" --home "$meter_home" app-server ingest -
          if "$binary" --home "$meter_home" proxy tls; then
            echo "TLS proxy unexpectedly accepted missing acknowledgement" >&2
            exit 1
          fi
