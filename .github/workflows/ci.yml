name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.11"
          - os: ubuntu-24.04
            python: "3.12"
          - os: ubuntu-24.04
            python: "3.13"
          - os: windows-2025
            python: "3.11"
          - os: windows-2025
            python: "3.13"
          - os: macos-15
            python: "3.11"
          - os: macos-15
            python: "3.13"
          - os: macos-15-intel
            python: "3.13"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -v
      - run: codex-meter --version
      - run: codex-meter --no-color demo
      - name: Validate shell installer syntax
        if: runner.os != 'Windows'
        run: sh -n install.sh
      - name: Validate PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: '[ScriptBlock]::Create((Get-Content -Raw install.ps1)) | Out-Null'
