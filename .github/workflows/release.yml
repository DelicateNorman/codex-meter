name: Build release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binaries:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: codex-meter-linux-x86_64
          - os: windows-2025
            asset: codex-meter-windows-x86_64.exe
          - os: macos-15
            asset: codex-meter-macos-arm64
          - os: macos-15-intel
            asset: codex-meter-macos-x86_64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install . "pyinstaller>=6.11,<7"
      - run: pyinstaller --noconfirm --clean --onefile --name codex-meter --collect-data codex_meter --collect-submodules email --hidden-import email.quoprimime --hidden-import email.base64mime packaging/codex_meter_entry.py
      - name: Name and verify executable
        shell: python {0}
        run: |
          import os
          import subprocess
          from pathlib import Path

          source = Path("dist/codex-meter.exe" if os.name == "nt" else "dist/codex-meter")
          target = Path("dist/${{ matrix.asset }}")
          source.rename(target)
          subprocess.run([str(target.resolve()), "--version"], check=True)
          subprocess.run([str(target.resolve()), "--no-color", "demo"], check=True)
      - name: Smoke-test Linux/macOS installer
        if: runner.os != 'Windows'
        run: |
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset }}" > SHA256SUMS
          else
            shasum -a 256 "${{ matrix.asset }}" > SHA256SUMS
          fi
          cd ..
          CODEX_METER_BASE_URL="$PWD/dist" CODEX_METER_BIN_DIR="$RUNNER_TEMP/codex-meter-bin" sh install.sh
          "$RUNNER_TEMP/codex-meter-bin/codex-meter" --version
      - name: Smoke-test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $asset = "${{ matrix.asset }}"
          $hash = (Get-FileHash -Algorithm SHA256 (Join-Path "dist" $asset)).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content -Encoding ascii (Join-Path "dist" "SHA256SUMS")
          $installDir = Join-Path $env:RUNNER_TEMP "codex-meter-bin"
          .\install.ps1 -BaseUrl (Resolve-Path "dist").Path -BinDir $installDir
          & (Join-Path $installDir "codex-meter.exe") --version
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  wheel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build --wheel
      - uses: actions/upload-artifact@v7
        with:
          name: release-wheel
          path: dist/*.whl
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [binaries, wheel]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: cd dist && sha256sum codex-meter-* codex_meter-*.whl > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Codex Meter $GITHUB_REF_NAME" --generate-notes
