name: Build release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binaries:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: codex-meter-linux-x86_64
          - os: macos-15
            asset: codex-meter-macos-arm64
          - os: macos-15-intel
            asset: codex-meter-macos-x86_64
          - os: windows-2025
            asset: codex-meter-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify release tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: python {0}
        run: |
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))["package"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"release tag {tag} does not match Cargo version v{version}")
      - run: cargo build --release --locked
      - name: Stage executable
        shell: bash
        run: |
          set -eu
          mkdir -p dist
          source=target/release/codex-meter
          if [ "${{ runner.os }}" = Windows ]; then source="$source.exe"; fi
          cp "$source" "dist/${{ matrix.asset }}"
          "dist/${{ matrix.asset }}" --version
          "dist/${{ matrix.asset }}" --no-color demo >/dev/null
      - name: Sign Windows executable when certificate secrets are configured
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE -or -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -notmatch "-") {
              throw "Stable releases require WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD."
            }
            Write-Warning "WINDOWS_CERTIFICATE secrets are not configured; publishing an unsigned executable."
            return
          }
          $certificate = Join-Path $env:RUNNER_TEMP "codex-meter-signing.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signTool = (Get-Command signtool.exe -ErrorAction Stop).Source
          & $signTool sign /fd SHA256 /td SHA256 /tr https://timestamp.digicert.com /f $certificate /p $env:WINDOWS_CERTIFICATE_PASSWORD "dist/${{ matrix.asset }}"
          if ($LASTEXITCODE -ne 0) { throw "Windows code signing failed" }
          & $signTool verify /pa /v "dist/${{ matrix.asset }}"
          if ($LASTEXITCODE -ne 0) { throw "Windows signature verification failed" }
      - name: Create platform checksum
        shell: python {0}
        run: |
          import hashlib
          from pathlib import Path

          asset = Path("dist/${{ matrix.asset }}")
          digest = hashlib.sha256(asset.read_bytes()).hexdigest()
          Path("dist/SHA256SUMS").write_text(f"{digest}  {asset.name}\n", encoding="ascii")
      - name: Download stable v0.15 binary for upgrade test
        shell: python {0}
        run: |
          import urllib.request
          from pathlib import Path

          target = Path("stable/${{ matrix.asset }}")
          target.parent.mkdir(parents=True, exist_ok=True)
          url = "https://github.com/DelicateNorman/codex-meter/releases/download/v0.15.0/${{ matrix.asset }}"
          urllib.request.urlretrieve(url, target)
          target.chmod(0o755)
      - name: Unix install, upgrade, checksum, rollback, and history acceptance
        if: runner.os != 'Windows'
        shell: bash
        run: sh tests/install_unix_acceptance.sh "$PWD/dist" "${{ matrix.asset }}" "$PWD/stable/${{ matrix.asset }}"
      - name: Windows install, upgrade, checksum, rollback, and history acceptance
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\tests\install_windows_acceptance.ps1 -AssetDir (Resolve-Path dist).Path -AssetName "${{ matrix.asset }}" -OldBinary (Resolve-Path "stable/${{ matrix.asset }}").Path
      - name: Install Windows ConPTY driver
        if: runner.os == 'Windows'
        run: python -m pip install pywinpty==3.0.5
      - name: Native terminal interaction
        run: python tests/interactive_pty_smoke.py "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  desktop:
    name: Desktop DMG · ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: Apple Silicon
            asset: codex-meter-desktop-macos-arm64.dmg
          - os: macos-15-intel
            label: Intel
            asset: codex-meter-desktop-macos-x86_64.dmg
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci
      - name: Build frontend for Tauri macros
        working-directory: desktop
        run: npm run build
      - name: Run desktop interaction, accessibility, and screenshot regression
        working-directory: desktop
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Check desktop Rust bridge
        run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Detect Apple Developer ID credentials
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if test -n "$APPLE_CERTIFICATE" && test -n "$APPLE_CERTIFICATE_PASSWORD" && test -n "$APPLE_ID" && test -n "$APPLE_PASSWORD" && test -n "$APPLE_TEAM_ID"; then
            echo "APPLE_SIGNING_READY=true" >> "$GITHUB_ENV"
          else
            case "${GITHUB_REF_TYPE:-}:${GITHUB_REF_NAME:-}" in
              tag:v*[!-0-9.]*) ;;
              tag:v*) echo "::error::Stable releases require all Apple Developer ID and notarization secrets."; exit 1 ;;
            esac
            echo "APPLE_SIGNING_READY=false" >> "$GITHUB_ENV"
            echo "::warning::Apple Developer ID secrets are incomplete; the app will be ad-hoc signed and cannot be notarized."
          fi
      - name: Import Apple Developer ID certificate
        if: env.APPLE_SIGNING_READY == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -eu
          certificate="$RUNNER_TEMP/codex-meter-signing.p12"
          keychain="$RUNNER_TEMP/codex-meter-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F\" '/Developer ID Application/{print $2; exit}')"
          test -n "$identity"
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Build native app and DMG
        working-directory: desktop
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri -- build --bundles app,dmg
      - name: Validate and stage DMG
        shell: bash
        run: |
          set -eu
          app="desktop/src-tauri/target/release/bundle/macos/Codex Meter.app"
          test -x "$app/Contents/MacOS/codex-meter-desktop"
          test -f "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app/Contents/Info.plist" | grep -F "com.delicatenorman.codexmeter"
          file "$app/Contents/MacOS/codex-meter-desktop"
          shopt -s nullglob
          dmgs=(desktop/src-tauri/target/release/bundle/dmg/*.dmg)
          test "${#dmgs[@]}" -eq 1
          mkdir -p dist
          cp "${dmgs[0]}" "dist/${{ matrix.asset }}"
          test -s "dist/${{ matrix.asset }}"
          codesign --verify --deep --strict --verbose=2 "$app"
      - name: First launch creates only private metadata state
        run: sh tests/desktop_first_launch.sh "desktop/src-tauri/target/release/bundle/macos/Codex Meter.app/Contents/MacOS/codex-meter-desktop"
      - name: Verify notarization ticket and Gatekeeper acceptance
        if: env.APPLE_SIGNING_READY == 'true'
        shell: bash
        run: |
          set -eu
          app="desktop/src-tauri/target/release/bundle/macos/Codex Meter.app"
          xcrun stapler validate "dist/${{ matrix.asset }}"
          spctl --assess --type execute --verbose=2 "$app"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  bundle:
    name: Assemble checksummed release
    needs: [binaries, desktop]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify manifest and create checksums
        run: |
          set -eu
          test -f dist/codex-meter-linux-x86_64
          test -f dist/codex-meter-macos-arm64
          test -f dist/codex-meter-macos-x86_64
          test -f dist/codex-meter-windows-x86_64.exe
          test -f dist/codex-meter-desktop-macos-arm64.dmg
          test -f dist/codex-meter-desktop-macos-x86_64.dmg
          cd dist
          sha256sum codex-meter-linux-x86_64 codex-meter-macos-arm64 codex-meter-macos-x86_64 codex-meter-windows-x86_64.exe codex-meter-desktop-macos-arm64.dmg codex-meter-desktop-macos-x86_64.dmg > SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: release-bundle
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -eu
          release_flags=()
          case "$GITHUB_REF_NAME" in
            *-*) release_flags+=(--prerelease) ;;
          esac
          notes_flags=(--generate-notes)
          notes="release-notes/$GITHUB_REF_NAME.md"
          if test -f "$notes"; then
            notes_flags=(--notes-file "$notes")
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "Codex Meter $GITHUB_REF_NAME" "${notes_flags[@]}" "${release_flags[@]}"

  public-install:
    name: Public install · ${{ matrix.asset }}
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: codex-meter-linux-x86_64
          - os: macos-15
            asset: codex-meter-macos-arm64
          - os: macos-15-intel
            asset: codex-meter-macos-x86_64
          - os: windows-2025
            asset: codex-meter-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Download stable v0.15 binary
        shell: python {0}
        run: |
          import urllib.request
          from pathlib import Path

          target = Path("stable/${{ matrix.asset }}")
          target.parent.mkdir(parents=True, exist_ok=True)
          url = "https://github.com/DelicateNorman/codex-meter/releases/download/v0.15.0/${{ matrix.asset }}"
          urllib.request.urlretrieve(url, target)
          target.chmod(0o755)
      - name: Public one-line install and rollback
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          test_root="$(mktemp -d)"
          bin_dir="$test_root/bin"
          meter_home="$test_root/meter-home"
          sessions="$test_root/sessions"
          mkdir -p "$bin_dir"
          cp "stable/${{ matrix.asset }}" "$bin_dir/codex-meter"
          chmod 0755 "$bin_dir/codex-meter"
          python tests/release_history_guard.py seed --binary "$bin_dir/codex-meter" --home "$meter_home" --sessions "$sessions"
          python tests/release_history_guard.py manifest --home "$meter_home" --output "$test_root/history.json"
          export CODEX_METER_BIN_DIR="$bin_dir"
          export CODEX_METER_HOME="$meter_home"
          curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_REF_NAME/install.sh" | sh
          "$bin_dir/codex-meter" --version | grep -F "${GITHUB_REF_NAME#v}"
          python tests/release_history_guard.py manifest --home "$meter_home" --expect "$test_root/history.json"
          curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_REF_NAME/install.sh" | sh -s -- --rollback
          "$bin_dir/codex-meter" --version | grep -F "0.15.0"
          python tests/release_history_guard.py manifest --home "$meter_home" --expect "$test_root/history.json"
      - name: Public one-line install and rollback
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP ("codex-meter-public-" + [guid]::NewGuid().ToString("N"))
          $binDir = Join-Path $testRoot "bin"
          $meterHome = Join-Path $testRoot "meter-home"
          $sessions = Join-Path $testRoot "sessions"
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          $destination = Join-Path $binDir "codex-meter.exe"
          Copy-Item "stable/${{ matrix.asset }}" $destination
          python tests/release_history_guard.py seed --binary $destination --home $meterHome --sessions $sessions
          python tests/release_history_guard.py manifest --home $meterHome --output (Join-Path $testRoot "history.json")
          $env:CODEX_METER_BIN_DIR = $binDir
          $env:CODEX_METER_HOME = $meterHome
          $installerUrl = "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_REF_NAME/install.ps1"
          $installer = [scriptblock]::Create((Invoke-WebRequest -UseBasicParsing $installerUrl).Content)
          & $installer
          $version = & $destination --version
          if ($version -notlike "*$($env:GITHUB_REF_NAME.Substring(1))*") { throw "unexpected installed version: $version" }
          python tests/release_history_guard.py manifest --home $meterHome --expect (Join-Path $testRoot "history.json")
          & $installer -Rollback
          $version = & $destination --version
          if ($version -notlike "*0.15.0*") { throw "rollback did not restore v0.15.0: $version" }
          python tests/release_history_guard.py manifest --home $meterHome --expect (Join-Path $testRoot "history.json")
