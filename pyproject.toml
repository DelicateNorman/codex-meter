[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-meter"
version = "0.12.4"
description = "Local-first usage and performance observability for Codex CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Codex Meter contributors" }]
dependencies = []
keywords = ["codex", "observability", "tokens", "usage", "tui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/DelicateNorman/codex-meter"
Repository = "https://github.com/DelicateNorman/codex-meter.git"
Issues = "https://github.com/DelicateNorman/codex-meter/issues"
Changelog = "https://github.com/DelicateNorman/codex-meter/blob/main/CHANGELOG.md"

[project.scripts]
codex-meter = "codex_meter.cli:main"

[tool.setuptools.packages.find]
include = ["codex_meter*"]

[tool.setuptools.package-data]
codex_meter = ["migrations/*.sql", "data/*.json"]
