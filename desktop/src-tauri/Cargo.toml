[package]
name = "codex-meter-desktop"
version = "0.17.0-beta.1"
description = "Native desktop dashboard for Codex Meter"
authors = ["Codex Meter contributors"]
edition = "2024"
rust-version = "1.85"
license = "MIT"

[lib]
name = "codex_meter_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "codex-meter-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
codex-meter = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", default-features = false, features = ["wry", "compression", "macos-private-api"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
